services:
  policyweb:
    build: .
    image: netspoc-web:local
    restart: unless-stopped
    ports:
      - "${POLICYWEB_PORT:-8080}:8080"
    environment:
      # Add the environment variables referenced by token_env, username_env and
      # password_env in docker/policyweb.conf here or in a local .env file.
      TZ: "${TZ:-UTC}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./docker/policyweb.conf:/etc/policyweb/policyweb.conf:ro
      # Hand-maintained changelog; browser refresh is enough after editing.
      - ./CHANGELOG.md:/srv/policyweb/CHANGELOG.md:ro
      # Writable because the policy administration UI stores drafts and
      # publishes generated policy versions here.
      - ${NETSPOC_DATA:-./docker/netspoc-data}:/var/lib/policyweb/netspoc
      - policyweb-sessions:/var/lib/policyweb/sessions
      - policyweb-users:/var/lib/policyweb/users
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  create-user:
    profiles: ["tools"]
    build: .
    image: netspoc-web:local
    entrypoint: ["/usr/local/bin/policyweb-create-user"]
    volumes:
      - policyweb-users:/var/lib/policyweb/users
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  policyweb-sessions:
  policyweb-users:
