<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Policy-Web – LDAP-Anmeldung</title>
  <script src="resources/js/theme.js"></script>
  <style>
    :root { font:14px Arial,sans-serif; color:#263746; background:#f5f8fb }
    body { margin:0; padding:2rem }
    main { max-width:480px; margin:auto }
    fieldset { background:AliceBlue; border:2px solid steelblue; padding:1rem }
    label { display:block; margin:.7rem 0 }
    input { box-sizing:border-box; width:100%; padding:.55rem }
    input[type=submit] { width:auto }
    .pw-page-heading { display:flex; justify-content:space-between; align-items:center }
  </style>
  <link rel="stylesheet" href="resources/css/theme-static.css">
</head>
<body>
<main>
  <div class="pw-page-heading"><h1>LDAP-Anmeldung</h1><button class="pw-theme-toggle" data-policyweb-theme-toggle type="button">Dark Mode</button></div>
  <form action="backend6/ldap-login" method="post">
    <fieldset>
      <legend>Verzeichnisdienst</legend>
      <label for="ldap-user">Benutzername<input id="ldap-user" name="user" autocomplete="username" required autofocus></label>
      <label for="ldap-pass">Kennwort<input id="ldap-pass" name="pass" type="password" autocomplete="current-password" required></label>
      <input type="submit" value="Anmelden">
    </fieldset>
  </form>
  <p><a href="index.html">Zur lokalen Anmeldung</a></p>
</main>
</body>
</html>
