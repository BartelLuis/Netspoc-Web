<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy-Web</title>
  <script src="resources/js/theme.js"></script>
  <style type="text/css">
    body {
      font-family: sans-serif;
    }

    form {
      width: 19em
    }

    fieldset {
      background-color: AliceBlue;
      border: 2px solid steelblue;
    }

    p#submit {
      text-align: right;
    }
  </style>
  <link rel="stylesheet" href="resources/css/theme-static.css">
</head>

<body onload="document.getElementById('email').focus();">
  <div class="pw-page-heading">
    <h1>Kennwort</h1>
    <button class="pw-theme-toggle" data-policyweb-theme-toggle type="button">Dark Mode</button>
  </div>
  <form action="backend6/register" method="post">
    <div>
      <fieldset>
        <legend>Neues Kennwort anfordern</legend>
        <p>
          <label for="email">Email:</label>
          <input id="email" name="email" type="text" size="30" />
        <p id="submit">
          <input type="submit" value="Kennwort anfordern" />
        </p>
      </fieldset>
    </div>
  </form>
</body>
</html>
