<!doctype html>
<html lang="de">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Policy-Web</title>
	<script src="resources/js/theme.js"></script>
	<style type="text/css">
		body,
		html {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0
		}

		.flex-container {
			display: flex;
			flex-direction: column;
			height: 80%;
			width: 99%;
		}

		body {
			font-family: sans-serif;
			color: #263746;
			background: #f5f8fb;
		}

		fieldset {
			background-color: AliceBlue;
			border: 2px solid steelblue;
		}

		.small {
			font-size: small;
		}

		#links {
			float: left;
		}

		#login-form {
			float: right;
		}

		#unten {
			clear: both
		}

		#maintenance-banner {
			clear: both;
			margin: 1rem 0;
			padding: .85rem 1rem;
			border: 2px solid #b36b00;
			border-radius: 4px;
			background: #fff3cd;
			color: #563b00;
			font-weight: 600;
		}
	</style>
	<link rel="stylesheet" href="resources/css/theme-static.css">
	<link rel="icon" type="image/vnd.microsoft.icon" href="resources/images/policyweb.ico">
</head>

<body onload="document.getElementsByName('email')[0].focus();">
	<div id="links">
		<div class="pw-page-heading">
			<h1>Policy-Web</h1>
			<button class="pw-theme-toggle" data-policyweb-theme-toggle type="button">Dark Mode</button>
		</div>
	</div>

	<form action="backend6/login" method="post" id="login-form">
		<fieldset>
			<legend class="small">Anmelden</legend>
			<input name="app" type="hidden" value="../app.html" />
			<label for="txtf_email">E-Mail:
				<input id="txtf_email" name="email" type="email" size="30" autocomplete="username" required></label>
			<label for="txtf_password">Kennwort:
				<input id="txtf_password" name="pass" type="password" size="15" autocomplete="current-password" required></label>
			<input id="btn_login" type="submit" value="Login">
			<div class="small">Neues <a href="passwd.html">Kennwort anfordern</a></div>
			<div class="small"><a href="ldap-login.html">Anmeldung über LDAP</a></div>
		</fieldset>
	</form>
	<div id="maintenance-banner" role="status" hidden></div>

	<p id="unten">
		<a href="start.html">Changelog</a>
	</p>
	<p>
		Hier finden Sie die zuletzt bereitgestellten Änderungen an Policy-Web.
	</p>

	<iframe src="start.html" class="flex-container" title="Basisinformationen und Changelog"></iframe>
	<script>
		fetch('backend6/maintenance-status', { cache: 'no-store' })
			.then(response => response.ok ? response.json() : Promise.reject(new Error(response.statusText)))
			.then(status => {
				if (!status.maintenance_mode) return;
				const banner = document.getElementById('maintenance-banner');
				banner.textContent = status.message;
				banner.hidden = false;
			})
			.catch(() => {});
	</script>
</body>

</html>
